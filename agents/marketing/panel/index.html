<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulsarMoon — Panel de Marketing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌙 PulsarMoon — Marketing Content</h1>
    <div class="filters">
      <button class="filter-btn active" data-status="all">Todos</button>
      <button class="filter-btn" data-status="pending">Pendientes</button>
      <button class="filter-btn" data-status="approved">Aprobados</button>
      <button class="filter-btn" data-status="rejected">Rechazados</button>
    </div>
  </header>

  <main id="content-list">
    <p class="loading">Cargando contenido...</p>
  </main>

  <!-- Modal de preview -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-tabs">
        <button class="tab-btn active" data-tab="blog">📝 Blog</button>
        <button class="tab-btn" data-tab="ig">📸 Instagram</button>
        <button class="tab-btn" data-tab="fb">📘 Facebook</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-actions">
        <button class="btn btn-approve" id="btn-approve">✅ Aprobar</button>
        <button class="btn btn-reject" id="btn-reject">❌ Rechazar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
